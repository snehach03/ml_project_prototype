# Render Blueprint. Create it with: New > Blueprint > pick this repository.
# Check the plan names against Render's current pricing before deploying.
databases:
  - name: stress-db
    plan: free            # free Postgres instances expire; choose a paid plan for anything lasting

services:
  - type: web
    name: stress-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: stress-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://stress-frontend.onrender.com     # <- put your real static-site URL here
      - key: MIN_METRIC_INTERVAL_SECONDS
        value: "20"

  - type: web
    name: stress-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://stress-api.onrender.com          # <- your API service URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
