# Render Blueprint - ONE web service (API + prebuilt dashboard) + Postgres.
# Share the single URL Render gives you. Create it with: New > Blueprint > pick your GitHub repo.
# Check plan names against Render's current pricing before deploying.
databases:
  - name: stress-db
    plan: free            # free Postgres instances expire; use a paid plan for anything lasting

services:
  - type: web
    name: behaviorsense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: stress-db
          property: connectionString
      - key: MIN_METRIC_INTERVAL_SECONDS
        value: "20"
      - key: DATA_RETENTION_DAYS
        value: "90"
